name: Update usagi manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update manifest
        shell: pwsh
        run: .\scripts\update-usagi.ps1

      - name: Commit changes
        shell: pwsh
        run: |
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'No changes detected.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/usagi.json
          git commit -m 'Update usagi manifest'
          git push
